name: Market direction research
on:
  push:
    branches: [main]
    paths:
      - 'projects/09-market-direction/**'
      - '.github/workflows/market-direction.yml'
  pull_request:
    paths:
      - 'projects/09-market-direction/**'
      - '.github/workflows/market-direction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: projects/09-market-direction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python verify.py
