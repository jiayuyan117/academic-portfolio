name: NLP research verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nlp-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'

jobs:
  evidence-and-sample:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/08-nlp-job-postings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: projects/08-nlp-job-postings/requirements.txt
      - name: Install research verification environment
        run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Verify committed full-study predictions and intervals
        run: python run.py verify
      - name: Test leakage and scoring invariants
        run: python run.py test
      - name: Train and independently verify the real-data smoke sample
        run: python run.py smoke
      - name: Check site deliverables
        run: python ../../tools/check_delivery.py --project 08
      - name: Reject generated changes to committed research results
        run: git diff --exit-code -- results requirements.txt data/sample
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nlp-sample-verification
          path: projects/08-nlp-job-postings/.runtime/smoke
          include-hidden-files: true
